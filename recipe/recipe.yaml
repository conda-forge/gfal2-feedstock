# Plugins requiring these dependencies are not currently built:
#   * lfc-devel
#   * dpm-devel
#   * libattr-devel
schema_version: 1

context:
  name: gfal2
  version: 2.23.5

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://gitlab.cern.ch/dmc/${{ name }}/-/archive/v${{ version }}/${{ name }}-v${{ version }}.tar.gz
  sha256: dd477d45dafeb9f8d867cd67be8d41aa4b5e2d325786be0df11d8b2cd2960756
  patches:
    - 0001-Drop-CMakeCXX11Support.patch
    - 0002-fix-cmake-minimum-version.patch
    - 003-cryptopp.patch

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - cmake
    - make
    - doxygen
    - pkg-config
    - sed
  host:
    - davix
    - glib
    - libssh2
    - libuuid
    - openldap
    - xrootd
    - zlib
    - cryptopp
    - json-c
    - pugixml
    - dcap
    - srm-ifce
    - gct
    - gtest
  run:
    - ${{ pin_compatible('json-c', upper_bound='x.x') }}
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x.x') }}

tests:
  - script:
      - gfal2_version

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: GFAL (Grid File Access Library) is a C library providing an abstraction layer of the grid storage system complexity.
  description: |
    GFAL (Grid File Access Library) is a C library providing an abstraction
    layer of the grid storage system complexity. The version 2 of GFAL tries to
    simplify at the maximum the file operations in a distributed environment.
    The complexity of the grid is hidden from the client side behind a simple
    common POSIX API. GFAL2 is able to manage all the common used file access
    protocols in a grid & cloud environment.
  homepage: http://dmc.web.cern.ch/projects/gfal-2/home
  repository: https://gitlab.cern.ch/dmc/gfal2
  documentation: http://dmc.web.cern.ch/projects/gfal-2/documentation

extra:
  recipe-maintainers:
    - chrisburr
